<section class="tw-w-full tw-px-[10%] tw-py-[6%] tw-flex tw-flex-col tw-place-items-center">
    {% if section.eyebrow %}
        <span class="tw-text-sm tw-font-semibold tw-uppercase tw-tracking-widest tw-text-brand-green">
            {{ section.eyebrow }}
        </span>
    {% endif %}
    <h2 class="tw-mt-2 tw-text-4xl max-md:tw-text-3xl tw-font-semibold tw-text-brand-navy tw-text-center">
        {{ section.heading }}
    </h2>

    <div class="tw-mt-10 tw-w-full tw-max-w-[760px] tw-flex tw-flex-col tw-gap-4">
        {% for item in section.items %}
            <div class="tw-flex tw-place-items-center tw-justify-between tw-gap-4 max-md:tw-flex-col max-md:tw-items-start
                        tw-bg-white tw-rounded-xl tw-shadow-md tw-p-5 tw-border-l-4 tw-border-brand-green">
                <div>
                    <h3 class="tw-text-lg tw-font-semibold tw-text-brand-navy">{{ item.title }}</h3>
                    <span class="tw-text-brand-muted tw-text-sm">
                        <i class="bi bi-geo-alt"></i> {{ item.location }} &nbsp;·&nbsp; {{ item.type }}
                    </span>
                </div>
                <a href="{% url 'contact-us' %}" class="btn !tw-py-2 !tw-text-sm">
                    Apply <i class="bi bi-arrow-right"></i>
                </a>
            </div>
        {% endfor %}
    </div>
</section>
