<section class="tw-w-full tw-px-[10%] tw-py-[6%] tw-bg-brand-light tw-flex tw-flex-col tw-place-items-center">
    {% if section.eyebrow %}
        <span class="tw-text-sm tw-font-semibold tw-uppercase tw-tracking-widest tw-text-brand-green">
            {{ section.eyebrow }}
        </span>
    {% endif %}
    <h2 class="tw-mt-2 tw-text-4xl max-md:tw-text-3xl tw-font-semibold tw-text-brand-navy tw-text-center">
        {{ section.heading }}
    </h2>

    <div class="tw-mt-10 tw-w-full tw-max-w-[760px] tw-flex tw-flex-col">
        {% for item in section.items %}
            <div class="tw-flex tw-gap-5">
                <div class="tw-flex tw-flex-col tw-place-items-center">
                    <div class="tw-w-4 tw-h-4 tw-rounded-full tw-bg-brand-green tw-mt-1"></div>
                    {% if not forloop.last %}
                        <div class="tw-w-[2px] tw-flex-1 tw-bg-brand-green/30"></div>
                    {% endif %}
                </div>
                <div class="tw-pb-8">
                    <span class="tw-text-brand-blue tw-font-bold">{{ item.year }}</span>
                    <h3 class="tw-text-lg tw-font-semibold tw-text-brand-navy">{{ item.title }}</h3>
                    <p class="tw-text-brand-muted">{{ item.text }}</p>
                </div>
            </div>
        {% endfor %}
    </div>
</section>
