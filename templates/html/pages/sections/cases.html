<section class="tw-w-full tw-px-[10%] tw-py-[6%] tw-bg-brand-light tw-flex tw-flex-col tw-place-items-center">
    {% if section.eyebrow %}
        <span class="tw-text-sm tw-font-semibold tw-uppercase tw-tracking-widest tw-text-brand-green">
            {{ section.eyebrow }}
        </span>
    {% endif %}
    <h2 class="tw-mt-2 tw-text-4xl max-md:tw-text-3xl tw-font-semibold tw-text-brand-navy tw-text-center">
        {{ section.heading }}
    </h2>

    <div class="tw-mt-10 tw-w-full tw-flex tw-flex-wrap tw-gap-6 tw-place-content-center tw-items-stretch">
        {% for item in section.items %}
            <div class="tw-w-[400px] tw-bg-white tw-rounded-xl tw-shadow-lg tw-p-7 tw-flex tw-flex-col tw-gap-3">
                <div class="tw-flex tw-place-items-center tw-gap-2">
                    <span class="tw-px-3 tw-py-1 tw-rounded-full tw-bg-brand-green/10 tw-text-brand-greendark tw-text-xs tw-font-semibold">
                        {{ item.industry }}
                    </span>
                    <span class="tw-text-brand-muted tw-text-sm">{{ item.client }}</span>
                </div>
                <h3 class="tw-text-xl tw-font-semibold tw-text-brand-navy">{{ item.title }}</h3>
                <p class="tw-text-brand-muted tw-text-sm">{{ item.result }}</p>
                <div class="tw-mt-2 tw-flex tw-gap-6 tw-border-t tw-border-slate-100 tw-pt-4">
                    {% for metric in item.metrics %}
                        <div class="tw-flex tw-flex-col">
                            <span class="tw-text-2xl tw-font-bold tw-text-brand-green">{{ metric.value }}</span>
                            <span class="tw-text-brand-muted tw-text-xs">{{ metric.label }}</span>
                        </div>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
    </div>
</section>
