<section class="tw-w-full tw-flex tw-flex-wrap tw-place-content-center tw-gap-[8%] tw-gap-y-6
                tw-px-[10%] tw-py-[3.5%] tw-text-center tw-bg-brand-green tw-text-white">
    {% for item in section.items %}
        <div class="tw-flex tw-flex-col">
            <span class="tw-text-5xl max-md:tw-text-4xl tw-font-bold">{{ item.value }}</span>
            <span class="tw-text-white/80">{{ item.label }}</span>
        </div>
    {% endfor %}
</section>
