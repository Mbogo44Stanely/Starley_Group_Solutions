<section class="tw-w-full tw-px-[10%] tw-py-[6%] tw-flex tw-flex-col tw-place-items-center">
    {% if section.eyebrow %}
        <span class="tw-text-sm tw-font-semibold tw-uppercase tw-tracking-widest tw-text-brand-green">
            {{ section.eyebrow }}
        </span>
    {% endif %}
    <h2 class="tw-mt-2 tw-text-4xl max-md:tw-text-3xl tw-font-semibold tw-text-brand-navy tw-text-center">
        {{ section.heading }}
    </h2>

    <div class="tw-mt-10 tw-w-full tw-flex tw-flex-wrap tw-gap-4 tw-place-content-center">
        {% for item in section.items %}
            <div class="tw-flex tw-place-items-center tw-gap-2 tw-px-5 tw-py-3 tw-rounded-lg
                        tw-bg-white tw-shadow-md tw-border tw-border-slate-100 tw-font-semibold tw-text-brand-navy">
                <i class="bi bi-patch-check-fill tw-text-brand-green"></i>
                {{ item.name }}
            </div>
        {% endfor %}
    </div>
</section>
